<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Ugonna Emeka-Inegbu | Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div class="relative min-h-[100dvh] overflow-hidden">
      <!-- Subtle accent glow, same as the portfolio hero -->
      <div
        aria-hidden="true"
        class="pointer-events-none absolute -right-24 -top-32 h-72 w-72 rounded-full bg-accent/10 blur-3xl"
      ></div>

      <main
        class="relative mx-auto flex min-h-[100dvh] w-full max-w-[420px] flex-col px-5 pb-5 pt-6"
      >
        <div class="flex flex-1 flex-col justify-center">
          <header>
            <div class="mb-4 h-1 w-10 rounded bg-accent"></div>
            <h1
              class="text-[clamp(1.6rem,8vw,2rem)] font-semibold leading-tight tracking-tight"
            >
              Ugonna Emeka-Inegbu
            </h1>
            <p class="mt-3 text-[0.95rem] leading-relaxed text-white/60">
              Senior EE student at Central Michigan University. Embedded
              systems, PCB design, and autonomous robotics. Graduating May 2027.
            </p>
          </header>

          <nav class="mt-6 flex flex-col gap-3" aria-label="Links">
            <a
              href="/resume.pdf"
              class="flex h-20 items-center justify-center gap-3 rounded-md bg-accent text-lg font-semibold text-background transition-transform active:scale-[0.98]"
            >
              Resume
              <span
                class="rounded border border-background/40 px-1.5 py-0.5 font-mono text-xs font-medium"
                >PDF</span
              >
            </a>

            <a
              href="/"
              class="flex h-14 items-center justify-between rounded-md border border-white/15 px-5 text-base font-medium text-white transition-colors hover:border-accent hover:text-accent active:border-accent active:text-accent"
            >
              Portfolio
              <span aria-hidden="true" class="font-mono text-white/40">↗</span>
            </a>

            <a
              href="https://www.linkedin.com/in/ugoemeka"
              target="_blank"
              rel="noopener noreferrer"
              class="flex h-14 items-center justify-between rounded-md border border-white/15 px-5 text-base font-medium text-white transition-colors hover:border-accent hover:text-accent active:border-accent active:text-accent"
            >
              LinkedIn
              <span aria-hidden="true" class="font-mono text-white/40">↗</span>
            </a>

            <a
              href="https://github.com/HackUgo"
              target="_blank"
              rel="noopener noreferrer"
              class="flex h-14 items-center justify-between rounded-md border border-white/15 px-5 text-base font-medium text-white transition-colors hover:border-accent hover:text-accent active:border-accent active:text-accent"
            >
              GitHub
              <span aria-hidden="true" class="font-mono text-white/40">↗</span>
            </a>
          </nav>
        </div>

        <footer class="pt-4 text-center font-mono text-xs text-white/40">
          This card is a PCB I designed.
        </footer>
      </main>
    </div>
  </body>
</html>
